# This is an example docker-compose file for deploying the chatbot worker on a VPS.
# On first run, use this command for setting up the worker:
# docker compose -f docker-compose.example-vps.yml run -it --rm chatbot-worker
# It will ask you to enter credentials for the chatbot server and will register the worker. After that, you can start the worker in detached mode:
# docker compose -f docker-compose.example-vps.yml up -d
#
# To authorize clients to run tool-execution requests on this worker (E2EA), register their
# signer credentials. You can either:
#   - Pass them as environment variables (see the WORKER_TRUSTED_SIGNER_* block below), or
#   - Run the trusted-signer admin mode once:
#     docker compose -f docker-compose.example-vps.yml run --rm chatbot-worker \
#       --add-trusted-signer --signer-id=<SIGNER_ID> --public-key-base64=<PUBLIC_KEY> --permissions=mcp:read,mcp:write
# The client's Signer ID and public key are shown under Settings -> E2EA Security.
# See https://github.com/Torvian-eu/chatbot/blob/master/docs/user%20guides/Trusted%20Signers%20guide.md

name: chatbot-worker

services:
  chatbot-worker:
    image: ghcr.io/torvian-eu/chatbot-worker:latest
    container_name: chatbot-worker
    # Run Docker's init (tini) as PID 1. The entrypoint execs the JVM, so the JVM is PID 1 and never
    # reaps processes that are not its own children; a killed descendant of an isolated command is
    # re-parented to PID 1 and would otherwise stay a zombie until the container is recreated.
    init: true
    environment:
      - CHATBOT_WORKER_SETUP_SERVER_URL=https://chatbot-server.yourdomain.com # Change to the actual URL of your chatbot server
      - PUID=1000  # Change to your actual host UID (run 'id -u')
      - PGID=1000  # Change to your actual host GID (run 'id -g')
      # Commands started by built-in tools run as a separate 'agent' account, so that they cannot
      # read this worker's secrets. Only set the two lines below when your host uid range collides
      # with the image defaults (agent uid 10002, shared gid 10003).
      # - AGENT_UID=10002
      # - AGENT_GID=10003
      # Isolation is opt-in and defaults to false, which runs commands as the worker account. This
      # image ships the helper and the accounts above, so the boundary is turned on here; set it to
      # false to run without it (the worker then logs a WARN at startup).
      - WORKER_COMMAND_ISOLATION_ENABLED=true
      # Trusted signer(s) for E2EA tool-execution authorization (optional, repeat slots as needed).
      # Each signer needs a unique ID, a Base64 public key, and optional comma-separated permissions.
      # - WORKER_TRUSTED_SIGNER_1_ID=client-desktop-7f3a
      # - WORKER_TRUSTED_SIGNER_1_PUBLIC_KEY_BASE64=MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcD...
      # - WORKER_TRUSTED_SIGNER_1_PERMISSION_1=mcp:read
      # - WORKER_TRUSTED_SIGNER_1_PERMISSION_2=mcp:write
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      - ./workspace:/app/workspace
      - npm-cache:/app/cache/npm
      - uv-cache:/app/cache/uv
    restart: unless-stopped

volumes:
  npm-cache:
  uv-cache: